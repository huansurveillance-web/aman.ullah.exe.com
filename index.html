<!doctype html>
<html lang="en">
  <head>
    <script>
      // Fix for "Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
            if (desc && !desc.set) {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return originalFetch;
                },
                set: function(val) {
                  originalFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e) {
          console.warn("[Fetch Patch] Failed to override fetch setter:", e);
        }
      })();
    </script>
